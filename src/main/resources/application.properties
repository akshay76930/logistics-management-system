spring.application.name=logistics-dashboard-api
spring.datasource.url=jdbc:h2:file:./data/logistics;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

app.auth.username=${APP_AUTH_USERNAME}
app.auth.password-hash=${APP_AUTH_PASSWORD_BCRYPT}
app.jwt.secret-base64=${JWT_SECRET_BASE64}
app.jwt.expiration=PT1H
